{% extends "base.html" %}{% block content %}<div class="container"><h2>Manage Users</h2><div class="table-responsive card border-0 shadow-sm rounded-4 mt-3"><table class="table mb-0"><tr><th>Username</th><th>Email</th><th>Role</th><th>Joined</th></tr>
{% for u in users %}<tr><td>{{ u.username }}</td><td>{{ u.email }}</td><td>{% if u.is_staff %}Admin{% else %}{{ u.profile.role|title }}{% endif %}</td><td>{{ u.date_joined|date:"d M Y" }}</td></tr>{% endfor %}</table></div></div>{% endblock %}
