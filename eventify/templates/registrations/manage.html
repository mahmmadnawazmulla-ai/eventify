{% extends "base.html" %}{% block content %}<div class="container"><div class="d-flex justify-content-between"><h2>Manage Registrations</h2><a class="btn btn-outline-secondary btn-sm align-self-center" href="?export=csv">Export CSV</a></div>
<div class="table-responsive card border-0 shadow-sm rounded-4 mt-3"><table class="table align-middle mb-0"><tr><th>ID</th><th>User</th><th>Event</th><th>Status</th><th>Action</th></tr>
{% for r in regs %}<tr><td>{{ r.reg_id }}</td><td>{{ r.user.username }}</td><td>{{ r.event.title }}</td><td><span class="badge status-{{ r.status }}">{{ r.get_status_display }}</span></td>
<td><form method="post" class="d-flex gap-1">{% csrf_token %}<button formaction="{% url 'set_status' r.pk 'confirmed' %}" class="btn btn-success btn-sm">Approve</button><button formaction="{% url 'set_status' r.pk 'rejected' %}" class="btn btn-danger btn-sm">Reject</button></form></td></tr>
{% empty %}<tr><td colspan="5" class="text-muted">Nothing here yet.</td></tr>{% endfor %}</table></div></div>{% endblock %}
