{% extends "base.html" %}{% block content %}<div class="container" style="max-width:520px"><div class="card border-0 shadow-sm rounded-4 p-4"><h3>Create account</h3>
<form method="post">{% csrf_token %}{% for f in form %}<div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}{% for er in f.errors %}<div class="text-danger small">{{ er }}</div>{% endfor %}</div>{% endfor %}
