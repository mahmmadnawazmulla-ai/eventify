{% extends "base.html" %}{% block content %}<div class="container" style="max-width:440px"><div class="card border-0 shadow-sm rounded-4 p-4"><h3>Login</h3>
<form method="post">{% csrf_token %}{% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}
<input name="username" class="form-control mb-3" placeholder="Username" required><input name="password" type="password" class="form-control mb-3" placeholder="Password" required>
<input type="hidden" name="next" value="{{ request.GET.next }}"><button class="btn btn-brand w-100">Login</button></form>
<p class="small mt-3">No account? <a href="{% url 'signup' %}">Sign up</a></p></div></div>{% endblock %}
