{% extends "base.html" %}{% block content %}<div class="container" style="max-width:520px"><div class="card border-0 shadow-sm rounded-4 p-4"><h3>My Profile</h3><p class="text-muted">{{ user.username }} · {{ user.email }} · {{ user.profile.role|title }}</p>
<form method="post">{% csrf_token %}{% for f in form %}<div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}</div>{% endfor %}<button class="btn btn-brand">Update</button></form></div></div>{% endblock %}
