{% extends "base.html" %}{% block content %}<div class="container" style="max-width:720px"><h2>{{ title }}</h2>
<form method="post" enctype="multipart/form-data" class="card border-0 shadow-sm rounded-4 p-4">{% csrf_token %}{{ form.non_field_errors }}
{% for f in form %}<div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}{% for er in f.errors %}<div class="text-danger small">{{ er }}</div>{% endfor %}</div>{% endfor %}
<button class="btn btn-brand">Save</button></form></div>{% endblock %}
