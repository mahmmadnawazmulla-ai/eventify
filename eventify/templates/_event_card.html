<div class="col-md-6 col-lg-4"><div class="card event-card h-100 shadow-sm border-0 reveal">
 {% if e.image %}<img src="{{ e.image.url }}" class="card-img-top" alt="">{% else %}<div class="card-img-top placeholder-img"><i class="bi bi-image"></i></div>{% endif %}
 <div class="card-body"><span class="badge bg-brand-soft">{{ e.category }}</span>
  <h5 class="mt-2">{{ e.title }}</h5>
  <p class="small text-muted mb-1"><i class="bi bi-calendar3"></i> {{ e.date }} · {{ e.start_time|time:"H:i" }}</p>
  <p class="small text-muted"><i class="bi bi-geo-alt"></i> {{ e.venue }} · {{ e.available_seats }} seats left</p>
  <a href="{% url 'event_detail' e.pk %}" class="btn btn-brand btn-sm">View details</a></div></div></div>
